name: exp012_s1
description: exp012 と同じ設定で seed だけ変更（seed 1042）。3×3 タイル同時予測（exp005 ベース、768→384、ResNet18、マスク付き BCE、3×3 陽性 crop:陰性 crop ≈ 1:3）
model:
  name: resnet18
  head: grid3x3
input:
  margin: 256
  resize: 384
train:
  epochs: 10
  batch_size: 64
  lr: 1.0e-3
  weight_decay: 0.05
  warmup_epochs: 1
  min_lr_factor: 0.01
  pos_fraction: 0.25
  amp_dtype: bf16
  seed: 1042
aug:
  rot90: true
  hflip: 0.5
  vflip: 0.5
  brightness: 0.2
  contrast: 0.2
  saturation: 0.3
  hue_deg: 15
  channel_gain: 0.08
  grayscale_p: 0.1
eval:
  batch_size: 128
